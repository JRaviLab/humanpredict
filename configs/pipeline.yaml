# Pipeline configuration. See PLAN.md for the meaning of each section.
seed: 42

paths:
  labeled_data: data/human_labeled.parquet   # .parquet or .csv
  bioproject_map: data exploration/entrez_mapping_checkpoint.json
  processed_dir: data/processed_updated
  splits_dir: data/splits_updated
  embeddings_dir: data/embeddings_updated
  artifacts_dir: artifacts_updated
  reports_dir: reports_updated

text:
  fields: [host_comments, isolation_comments, comments]
  prefixes: {host_comments: "host", isolation_comments: "isolation", comments: "comments"}
  separator: " | "
  placeholder_tokens: [missing, not collected, not applicable, not available, na, n/a,
                       unknown, none, "-", not provided, restricted access]

embedding:
  model: NeuML/pubmedbert-base-embeddings
  revision: b79526d6ef3645e0df4530322e266f24c829f5ef   # pinned 2026-09-29
  device: cuda
  fp16: true
  max_seq_length: 256
  batch_size: 256
  normalize: true
  near_dup_cosine: 0.98
  sim_chunk: 512           # query rows per GPU similarity block; 4096 OOMs on 8 GB with ~840k labeled texts

split:
  fractions: {train: 0.70, val: 0.15, test: 0.15}
  max_group_frac: 0.05

stage1:
  cv_folds: 5
  C_grid: {logspace_start: -3, logspace_stop: 2, num: 11}
  class_weight_grid: [null, balanced]
  l1_ratio: 0.0          # L2; sklearn 1.9 deprecates `penalty`
  solver: lbfgs
  max_iter: 5000
  scoring: f1
  n_jobs: 3             # each CV fit holds ~4-5 GB; 12 exceeds 23 GB RAM at ~600k train rows
  learning_curve_fractions: [0.02, 0.05, 0.1, 0.2, 0.4, 0.7, 1.0]

stage2:
  target_precision: 0.98
  max_pseudo_ratio: 1.0          # pseudo-labeled rows at most 1x the labeled training rows
  pseudo_weight_grid: [0.25, 0.5, 1.0]
  max_rounds: 3
  min_val_f1_gain: 0.002
  audit_sample_per_class: 100

evaluation:
  bootstrap_iters: 1000
